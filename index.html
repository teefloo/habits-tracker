<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Habitudes</title>
  <meta name="description" content="Suivi quotidien de vos habitudes.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f6f7">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161618">
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Habitudes">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%232e7d5b'/%3E%3Cpath d='M10 16.5l4.2 4.2L22 12.5' fill='none' stroke='%23ffffff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="shell" id="auth-view">
    <main class="card auth-card">
      <h1 class="title auth-title">Habitudes</h1>

      <form id="login-form" class="auth-form" novalidate>
        <div class="field">
          <label for="login-email">Email</label>
          <input id="login-email" name="email" type="email" autocomplete="email"
                 maxlength="254" required>
        </div>
        <div class="field">
          <label for="login-password">Mot de passe</label>
          <input id="login-password" name="password" type="password"
                 autocomplete="current-password" maxlength="200" required>
        </div>
        <p class="auth-error" id="login-error" hidden></p>
        <button type="submit" class="primary-btn auth-submit" id="login-submit">
          Se connecter
        </button>
        <button type="button" class="ghost-btn auth-switch" id="show-register">
          Créer un compte
        </button>
      </form>

      <form id="register-form" class="auth-form" novalidate hidden>
        <div class="field">
          <label for="register-email">Email</label>
          <input id="register-email" name="email" type="email" autocomplete="email"
                 maxlength="254" required>
        </div>
        <div class="field">
          <label for="register-password">Mot de passe</label>
          <input id="register-password" name="password" type="password"
                 autocomplete="new-password" minlength="8" maxlength="200" required>
          <p class="field-hint">8 caractères minimum</p>
        </div>
        <p class="auth-error" id="register-error" hidden></p>
        <button type="submit" class="primary-btn auth-submit" id="register-submit">
          Créer le compte
        </button>
        <button type="button" class="ghost-btn auth-switch" id="show-login">
          Se connecter
        </button>
      </form>
    </main>
  </div>

  <div class="shell" id="app-view" hidden>

    <header class="topbar">
      <h1 class="title">Habitudes</h1>

      <div class="topbar-actions">
        <nav class="weeknav" aria-label="Navigation par semaine">
          <button type="button" id="prev-week" class="icon-btn" aria-label="Semaine précédente">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8 10 12.5"/></svg>
          </button>
          <time class="week-range" id="week-range">—</time>
          <button type="button" id="next-week" class="icon-btn" aria-label="Semaine suivante">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>
          </button>
          <button type="button" id="today-btn" class="ghost-btn">Aujourd'hui</button>
        </nav>
        <button type="button" id="logout-btn" class="ghost-btn">Déconnexion</button>
      </div>
    </header>

    <main class="card" id="card">
      <p class="sync-error" id="sync-error" role="status" hidden>
        <span>Connexion perdue, les changements ne sont pas enregistrés.</span>
        <button type="button" class="ghost-btn" id="sync-retry">Réessayer</button>
      </p>

      <div class="grid-scroll" id="grid-scroll" hidden>
        <div class="grid" id="grid" role="grid" aria-label="Suivi hebdomadaire des habitudes">
          <div class="cell corner" id="corner">Habitude</div>
          <div id="day-headers"></div>
          <div id="rows"></div>
        </div>
      </div>

      <div class="empty" id="empty" hidden>
        <p class="empty-text">Aucune habitude pour l'instant.</p>
        <button type="button" class="ghost-btn" id="empty-add">Ajouter une première habitude</button>
      </div>

      <form class="add-form" id="add-form" hidden>
        <label class="sr-only" for="new-habit">Nom de la nouvelle habitude</label>
        <input id="new-habit" type="text" maxlength="60" placeholder="Ex. Lire 20 minutes"
               autocomplete="off" spellcheck="false">
        <button type="submit" class="primary-btn">Ajouter</button>
      </form>
    </main>

  </div>

  <div class="shell" id="blocked-view" hidden>
    <main class="card blocked-card">
      <h1 class="blocked-title" id="blocked-title">Service indisponible</h1>
      <p class="blocked-text" id="blocked-text"></p>
      <button type="button" class="primary-btn" id="blocked-retry">Réessayer</button>
    </main>
  </div>

  <script src="app.js"></script>
  <script src="auth.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
